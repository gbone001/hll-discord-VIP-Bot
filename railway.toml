[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[mounts]]
# Persistent volume for limiter state and other runtime metadata
# Set FRONTLINE_STATE_DIR=/data in Railway so the app writes state into this mount.
source = "data"
path = "/data"
